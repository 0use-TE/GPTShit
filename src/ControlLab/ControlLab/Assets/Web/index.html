<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ControlLab · Wokwi</title><style>
:root{color-scheme:dark;--bg:#1f1f1f;--fg:#ccc;--border:#2b2b2b;--accent:#75beff;--selected:#333;--muted:#858585;--comment:#6a9955;--string:#ce9178;--keyword:#c586c0;--number:#b5cea8;--function:#dcdcaa}
:root[data-theme=light]{color-scheme:light;--bg:#fff;--fg:#3b3b3b;--border:#e5e5e5;--accent:#005fb8;--selected:#e8f1fc;--muted:#858585;--comment:#008000;--string:#a31515;--keyword:#af00db;--number:#098658;--function:#795e26}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px system-ui;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column}header{height:38px;flex-shrink:0;padding:4px 8px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border)}
button{font:inherit;background:transparent;color:var(--fg);border:0;border-radius:5px;padding:5px 12px;cursor:pointer}button:hover{background:var(--selected)}button[aria-selected=true]{background:var(--selected);color:var(--accent)}button:focus-visible{outline:1px solid var(--accent)}
#status{display:none}#browser-tools{display:none;margin-left:auto;gap:4px}body.browser #browser-tools{display:flex}
#workspace{display:flex;flex:1;min-height:0;overflow:hidden}iframe{border:0;flex:1;background:var(--bg);width:100%;min-width:0;min-height:0}#workspace.has-source iframe{width:48%}#workspace.has-source #source{width:52%;border-left:1px solid var(--border)}@media(max-width:800px){#workspace.has-source{flex-direction:column}#workspace.has-source iframe,#workspace.has-source #source{width:100%;height:50%;flex:1}#workspace.has-source #source{border-left:0;border-top:1px solid var(--border)}} [hidden]{display:none!important}
#source{margin:0;flex:1;overflow:auto;tab-size:4;padding:16px 20px 24px 0;line-height:22px;font:13px/22px "Cascadia Mono",Consolas,monospace;counter-reset:line;white-space:pre;outline:none}
.code-line{display:block;min-height:22px}.code-line::before{counter-increment:line;content:counter(line);display:inline-block;width:44px;margin-right:20px;text-align:right;color:var(--muted);user-select:none}
.token.comment{color:var(--comment)}.token.string{color:var(--string)}.token.keyword,.token.boolean{color:var(--keyword)}.token.number{color:var(--number)}.token.function,.token.builtin{color:var(--function)}
</style></head><body>
<header role="tablist" aria-label="仿真工作区"><button id="circuit-tab" role="tab" aria-selected="true" aria-controls="simulator">电路</button><button role="tab" data-source="main.py" aria-selected="false" aria-controls="source">main.py</button><button role="tab" data-source="pid.py" aria-selected="false" aria-controls="source">pid.py</button><span id="status">正在连接仿真环境…</span>
<div id="browser-tools"><button id="start">启动</button><button id="on">控温</button><button id="off">停止</button><button id="ping">Ping</button></div></header>
<main id="workspace"><iframe id="simulator" title="Wokwi 恒温箱" allow="autoplay; clipboard-write" src="about:blank"></iframe>
<pre id="source" role="tabpanel" aria-label="下位机代码" tabindex="0" hidden><code id="source-code" class="language-python"></code></pre></main>
<script>window.Prism={manual:true};</script><script src="vendor/prism-core.min.js"></script><script src="vendor/prism-python.min.js"></script>
<script type="module" src="bridge.js"></script></body></html>
